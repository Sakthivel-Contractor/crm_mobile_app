# Development only: `flutter run -d chrome` serves the app on localhost:5000
# and forwards /api/* to the Frappe server, so the browser sees one site and
# keeps Frappe's SameSite=Lax session cookie. In the app's login screen use
# Server URL: http://localhost:5000
#
# Change `target` to point at another Frappe server.
server:
  host: localhost
  port: 5000
  proxy:
    - target: "https://scribble-vitalize-sugar.ngrok-free.dev/"
      prefix: "/api/"
